*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Baloo",ui-rounded,"Nunito","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:700;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;font-weight:800}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
body:not(.ads-on) .adslot{display:none!important}
.adslot{min-height:90px;width:100%;max-width:340px;margin:150px auto 10px;border-radius:12px;background:rgba(0,0,0,.06)}
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.screen.dim{background:rgba(20,10,40,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:12px;margin:auto 0}
.screen .wrap>*{animation:pop .45s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:8px 24px 12px;border-radius:18px;font-size:22px;color:#fff;background:linear-gradient(180deg,var(--c1,#ff9a6b),var(--c2,#ff6b4a));box-shadow:0 5px 0 var(--c3,#b8321a),0 9px 18px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c3,#b8321a),0 3px 8px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.g{--c1:#74e597;--c2:#33c065;--c3:#18793c}.btn.y{--c1:#ffe07a;--c2:#ffbf2e;--c3:#b87600;color:#6b3a00;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.b{--c1:#8cc2ff;--c2:#4c93f5;--c3:#2556a8}.btn.p{--c1:#c9a4ff;--c2:#9b63f5;--c3:#5a32a8}.btn.w{--c1:#fff;--c2:#f1ecf6;--c3:#cdbfdc;color:var(--ink);text-shadow:none}
.btn.big{min-height:68px;font-size:32px;padding:8px 48px 14px;border-radius:22px}
.btn.sm{min-height:44px;font-size:18px;padding:6px 16px 9px;border-radius:14px}
.btn[disabled]{filter:grayscale(.85);opacity:.6}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.panel{width:100%;background:rgba(255,255,255,.94);border-radius:22px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.1),0 14px 30px rgba(0,0,0,.18);color:var(--ink)}
.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar h2{font-size:30px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.ib{width:50px;height:50px;min-height:50px;padding:0;border-radius:16px;font-size:24px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);color:#fff;border-radius:999px;padding:4px 14px 6px;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23f 40%,#e09a00);box-shadow:inset 0 -2px 0 rgba(150,80,0,.5),0 1px 0 rgba(0,0,0,.2)}
.set{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;font-size:19px;border-bottom:2px solid rgba(0,0,0,.06)}
.set:last-child{border:0}
.seg{display:flex;background:rgba(0,0,0,.08);border-radius:12px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:16px;color:var(--ink)}
.seg button.on{background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:60;background:rgba(30,20,60,.92);color:#fff;padding:10px 18px;border-radius:16px;font-size:18px;pointer-events:none;animation:pop .35s both;text-align:center;max-width:90vw}
.help p{font-size:17px;line-height:1.35;margin:6px 0}
.byline{font-size:20px;color:#fff;opacity:.95;text-shadow:0 2px 0 rgba(0,0,0,.25);margin-top:-8px}
.stars{display:flex;gap:6px;justify-content:center}
.stars i{width:54px;height:54px;display:block;background:no-repeat center/contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
@media (orientation:landscape) and (max-height:500px){.wrap{max-width:640px;gap:8px}.btn.big{min-height:56px;font-size:26px}.topbar h2{font-size:24px}}
:root{--bg:#141a33;--ink:#fff;--gold:#ffd166}
#hud{position:fixed;z-index:10;left:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px calc(env(safe-area-inset-left,0px) + 10px);pointer-events:none}
#hud>*{pointer-events:auto}
.rk{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:rgba(18,22,44,.78);border:1.5px solid rgba(255,255,255,.14);border-radius:16px;padding:5px 10px 5px 5px;box-shadow:0 6px 16px rgba(0,0,0,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rk{position:relative}.rks{position:absolute;left:30px;top:-5px;z-index:1;font-style:normal;font-size:10.5px;font-weight:900;line-height:1;color:#4a2f00;background:linear-gradient(180deg,#fff3c4,#ffd166);border:1.5px solid #fff;border-radius:999px;padding:2px 5px 2px 3px;box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none;white-space:nowrap}
.rkb{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;font-weight:900;color:#4a2f00;background:linear-gradient(180deg,#ffe49a,#f0a92e);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 #a86a10}
.rkt{flex:1;min-width:0}.rkt b{display:block;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{position:relative;height:14px;margin-top:3px;border-radius:7px;background:rgba(0,0,0,.4);overflow:hidden}
.xp i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:7px;background:linear-gradient(180deg,#9dffb8,#2fbf6a);box-shadow:inset 0 2px 0 rgba(255,255,255,.4);transition:width .25s}
.xp i.full{background:linear-gradient(180deg,#ffe49a,#f0a92e);animation:shine 1s infinite}
.xp span{position:absolute;inset:0;font-size:10.5px;line-height:14px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6)}
@keyframes shine{50%{filter:brightness(1.3)}}
.cn{flex:none;display:flex;align-items:center;gap:6px;background:rgba(18,22,44,.78);border:1.5px solid rgba(255,255,255,.14);border-radius:16px;padding:5px 10px 5px 6px;box-shadow:0 6px 16px rgba(0,0,0,.3);min-width:96px}
.cn b{display:block;font-size:16px;line-height:1.05;color:var(--gold)}.cn small{display:block;font-size:10.5px;opacity:.8;font-weight:600}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c8,#ffd166 40%,#d99a1a);box-shadow:inset 0 -2px 0 #b07510,0 2px 4px rgba(0,0,0,.3);position:relative}
.coin:after{content:"$";position:absolute;inset:0;text-align:center;line-height:26px;font-size:15px;font-weight:900;color:#9a6200}
.coin.pop{animation:cpop .25s}@keyframes cpop{50%{transform:scale(1.35)}}
.ib{flex:none;width:42px;height:42px;border-radius:13px;background:rgba(18,22,44,.78);border:1.5px solid rgba(255,255,255,.14);font-size:19px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.ib:active,.btn:active,.it button:active{transform:scale(.95)}
#combo{position:fixed;z-index:9;font-size:18px;font-weight:900;color:#ffd166;text-shadow:0 2px 0 #7a3c00,0 0 12px rgba(255,180,60,.7);pointer-events:none;transform:translate(-50%,0)}
#panel{position:fixed;z-index:10;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(180deg,rgba(28,34,66,.96),rgba(16,20,40,.99));border-top:2px solid rgba(255,209,102,.3);box-shadow:0 -10px 30px rgba(0,0,0,.4);border-radius:20px 20px 0 0}
@media (orientation:landscape){#panel{left:auto;top:0;border-radius:20px 0 0 20px;border-top:0;border-left:2px solid rgba(255,209,102,.3);padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 10px) 10px}}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(0,0,0,.25);padding:4px;border-radius:14px}
.tabs button{padding:7px 0;border-radius:11px;font-size:14px;opacity:.75}.tabs button.on{opacity:1;background:linear-gradient(180deg,#6a8cff,#4058d8);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 2px 0 #2a3a96}
.list{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:7px;padding:2px}
.list.fade{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 54px),rgba(0,0,0,.25));mask-image:linear-gradient(180deg,#000 calc(100% - 54px),rgba(0,0,0,.25))}
.lmore{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:center;pointer-events:none;z-index:2}
.lmore span{pointer-events:auto;cursor:pointer;font-size:12.5px;font-weight:800;color:#ffd166;background:rgba(18,22,44,.94);border:1.5px solid rgba(255,209,102,.6);border-radius:999px;padding:5px 14px;box-shadow:0 4px 12px rgba(0,0,0,.45);animation:lmb 1.6s ease-in-out infinite}
@keyframes lmb{50%{transform:translateY(-3px)}}
.it{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.08)}
.it .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:radial-gradient(circle at 40% 30%,rgba(255,255,255,.25),rgba(255,255,255,.05));overflow:hidden}
.it .ic canvas{width:44px;height:44px}
.it .tx{flex:1;min-width:0;line-height:1.15}.it .tx b{font-size:14.5px;display:block}.it .tx small{font-size:11.5px;opacity:.75;font-weight:600;display:block}
.it button{flex:none;min-width:78px;padding:8px 8px;border-radius:12px;font-size:13px;line-height:1.1;color:#3a2600;background:linear-gradient(180deg,#ffe49a,#f0a92e);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 #a86a10}
.it button.g{color:#fff;background:linear-gradient(180deg,#7dffa8,#24a85a);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 #13703a}
.it button.off{filter:grayscale(.9) brightness(.7)}
.it.lock{opacity:.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 22px;border-radius:16px;font-size:17px;min-width:150px;color:#fff;background:linear-gradient(180deg,#6a8cff,#4058d8);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 #2a3a96,0 8px 16px rgba(0,0,0,.3)}
.btn.go{background:linear-gradient(180deg,#7dffa8,#24a85a);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 4px 0 #13703a,0 8px 16px rgba(0,0,0,.3)}
.btn.w{background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 3px 0 rgba(0,0,0,.25)}
.btn.big{font-size:22px;padding:13px 30px;min-width:210px}.btn.sm{font-size:14px;padding:8px 14px;min-width:0}
.btn.promo{width:100%;color:#4a2f00;font-size:18px;background:linear-gradient(180deg,#ffe49a,#f0a92e);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #a86a10,0 0 22px rgba(255,200,80,.6);animation:pp 1s infinite}
@keyframes pp{50%{transform:scale(1.03);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #a86a10,0 0 34px rgba(255,200,80,.9)}}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.title{gap:10px}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.9;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25)) drop-shadow(0 12px 24px rgba(0,0,0,.4))}
.logo .a{font-size:min(15vw,64px);color:#fff;-webkit-text-stroke:2px #23306e}
.logo .b{font-size:min(18vw,78px);background:linear-gradient(180deg,#fff2b0,#ffd166 45%,#f08a1e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #7a3c00}
.tag{font-size:18px;color:#e6ecff;text-shadow:0 2px 6px rgba(0,0,0,.6)}.byline{font-size:14px;opacity:.85;margin-bottom:6px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.panel{width:100%;background:linear-gradient(180deg,rgba(40,48,92,.97),rgba(22,27,54,.98));border:2px solid rgba(255,209,102,.35);border-radius:22px;padding:18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.panel h2{font-size:26px;color:var(--gold);line-height:1.05}.panel p{font-size:14.5px;line-height:1.35;opacity:.9;font-weight:600}
.panel .big{font-size:20px;color:#fff}
.rw{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.rw span{background:rgba(255,255,255,.1);border-radius:12px;padding:6px 12px;font-size:15px}
.stars{font-size:30px;letter-spacing:4px}
.how{text-align:left;font-size:14px;line-height:1.4;font-weight:600;display:flex;flex-direction:column;gap:6px}
#toast{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);background:rgba(18,22,44,.92);border:1.5px solid rgba(255,209,102,.5);padding:8px 16px;border-radius:14px;font-size:14px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none;animation:pop .3s both}
#scrTitle{background:radial-gradient(ellipse at 50% 40%,rgba(20,26,60,.15),rgba(10,12,30,.65))}
@media (orientation:landscape) and (max-height:430px){.logo .a{font-size:44px}.logo .b{font-size:54px}.title{gap:6px}.btn.big{font-size:19px;padding:10px 26px}.tag{font-size:15px}.panel{padding:12px}.panel h2{font-size:22px}}
@media (orientation:landscape) and (max-height:430px){.stars{font-size:22px}.center{gap:6px}.panel p{font-size:13px}.rw span{padding:4px 10px;font-size:13px}#scrEnd .btn{padding:8px 16px;font-size:15px;min-width:0}}

/* v5: short-landscape title - solid buttons with good contrast over the desk art (portrait unchanged) */
@media (orientation:landscape) and (max-height:430px){#scrTitle .btn.w{background:linear-gradient(180deg,#3a4677,#26305a);border:2px solid rgba(255,255,255,.28);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 0 #10152e,0 6px 14px rgba(0,0,0,.35)}#scrTitle .btn.w:active{transform:translateY(2px)}}

/* QA 2026-10-18: keep the toast centred - the shared pop keyframe ends on transform:none, which dropped translateX(-50%) */
@keyframes coToast{from{opacity:0;transform:translate(-50%,16px) scale(.94)}to{opacity:1;transform:translateX(-50%)}}
#toast{animation-name:coToast}

</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
 <div class="rk"><div class="rkb" id="rkB">1</div><em class="rks hidden" id="rkS"></em><div class="rkt"><b id="rkT">Intern</b><div class="xp"><i id="xpF"></i><span id="xpL">0 / 40</span></div></div></div>
 <div class="cn"><div class="coin"></div><div><b id="cnV">0</b><small id="cnS">+0/s</small></div></div>
 <button class="ib" id="bMenu" aria-label="Menu">☰</button>
</div>
<div id="combo" class="hidden">COMBO x1.0</div>
<div id="panel" class="hidden">
 <button class="btn promo hidden" id="bPromo">⭐ Get Promoted!</button>
 <div class="tabs"><button data-tab="tasks" class="on">Tasks</button><button data-tab="ups">Office</button><button data-tab="team">Team</button></div>
 <div class="list" id="list"></div>
 <div class="lmore hidden" id="lmore"><span>▼ More below</span></div>
</div>
<div id="toast" class="hidden"></div>
<div id="scrTitle" class="screen hidden">
 <div class="wrap title">
  <h1 class="logo" style="--i:0"><span class="a">Corner</span><span class="b">Office</span></h1>
  <div class="tag" style="--i:1">Climb from Intern to CEO!</div>
  <div class="byline" style="--i:1">by Zaib</div>
  <button class="btn go big" id="bPlay" style="--i:2">Play</button>
  <button class="btn w" id="bNew" style="--i:3">New Career</button>
  <div class="row" style="--i:3"><button class="btn w sm" id="bHow">How to play</button><button class="btn w sm" id="bSnd">Sound: On</button></div>
 </div>
</div>
<div id="scrEnd" class="screen dim hidden"><div class="wrap"><div class="panel center" id="endBox"></div></div></div>
<div id="pnl" class="screen dim hidden"><div class="wrap"><div class="panel center" id="pnlBox"></div></div></div>
